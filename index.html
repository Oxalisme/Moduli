<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Formulaires</title>
  
<!-- Images du raccourci écran d'accueil et favicon -->
<link rel="apple-touch-icon" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">
<link rel="icon" type="image/png" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">

<style>
  
/* CORRECTION LARGEUR : Force tous les éléments à respecter strictement les 100% */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
}

form {
  display: none;
  margin-top: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}
  
/*style de base pour TOUS les boutons*/
button {
  width: 100%;
  padding: 20px;
  margin: 10px 0;
  font-size: 30px;
  border-radius: 12px;
  cursor: pointer;
}
  
input, textarea, select, div, #resultatRapport {
  font-family: 'Ubuntu Sans', regular;
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 24px;
  border-radius: 12px;
  resize: none; /* Désactive la poignée manuelle pour laisser le script gérer la hauteur */
  overflow-y: hidden; 
}
textarea, #resultatRapport {
  min-height: 100px;
}
/* Optionnel : Donne un style sympa aux titres et listes générés à l'intérieur du rapport
#resultatRapport h3, #resultatRapport h4 { margin: 10px 0 5px 0; color: #193CB8; }
#resultatRapport ul, #resultatRapport ol { margin: 5px 0; padding-left: 25px; } */
  
/* Force la même police et le même style pour TOUS les placeholders */
input::placeholder, 
textarea::placeholder {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Grise le texte du select UNIQUEMENT quand l'option par défaut (vide) est sélectionnée */
select:invalid {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Remet le texte en noir normal dès qu'une vraie option est choisie */
select:valid {
  color: black;
  font-family: Arial, sans-serif;
}  
  
/* Surligne en rouge le champ obligatoire non rempli ou mal rempli */
input:user-invalid, 
textarea:user-invalid, 
select:user-invalid {
  border: 3px solid #DC2626 !important; /* Rouge vif d'alerte */
}
  
#message {
  margin-top: 20px;
  font-weight: bold;
  color: green;
}
  
/* 1. THÈME CHANTIER (Rouge / Rose) */
  /* .theme-chantier, */
.theme-chantier input, 
.theme-chantier textarea, 
.theme-chantier select {
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
}

/* 2. THÈME HEURES (Vert) */
  /* .theme-heures, */
.theme-heures input, 
.theme-heures textarea, 
.theme-heures select {
  background-color: #ECFDF5;
  border: 1px solid #016630;
}

/* 3. THÈME COMPLÉMENTS (Bleu) */
  /* .theme-complements, */
.theme-complements input, 
.theme-complements textarea, 
.theme-complements select,
#resultatRapport {
  background-color: #EFF6FF;
  border: 1px solid #193CB8;
}

/* 4. BOUTONS D'ENVOI (Jaune) */
button.btn-envoyer, button.btn-effacer {
  background-color: #FEFCE8 !important;
}
/* On force la bordure du bouton d'envoi à correspondre à son formulaire parent */
.theme-chantier button.btn-envoyer { border: 1px solid #9F0712; }
.theme-heures button.btn-envoyer { border: 1px solid #016630; }
.theme-complements button.btn-envoyer, 
.theme-complements button.btn-effacer { border: 1px solid #193CB8; }

</style>
</head>
<body>

<h2>Choisir un formulaire</h2>

<button onclick="showForm('chantier')" style="background-color: #FEF2F2; border: 1px solid #9F0712;">Chantier</button>
<button onclick="showForm('heures')" style="background-color: #ECFDF5; border: 1px solid #016630;">Heures</button>
<button onclick="showForm('complements')" style="background-color: #EFF6FF; border: 1px solid #193CB8;">Rapport des heures</button>

<!-- FORMULAIRE CHANTIER -->
<form id="formChantier" class="theme-chantier" onsubmit="event.preventDefault(); sendChantier();">
<!--
<form id="formChantier" class="theme-chantier">
-->
  <h3>Chantier</h3>

  <label>Ton nom</label>
  
  <select id="collegueChant" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected>Vladimir Oulianov</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg">Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael">Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (précise cette info dans le champs ci-dessous)</option>
  </select>
  <!--
  disabled : L'utilisateur ne peut pas recliquer dessus dans la liste.
  selected : Elle s'affiche en premier à l'ouverture de la page.
  hidden : Elle n'apparaît pas dans la liste déroulante une fois celle-ci ouverte. 
  -->

  <label>Avec qui tu as travaillé sur le chantier</label>
  <input type="text" id="collegueAutreChant">

  <label>Nom du client</label>
  <input type="text" id="client" required>

  <label>Lieu</label>
  <input type="text" id="lieu" placeholder="adresse ou précision p.ex. concernant les 4 maisons de Chloé" required>

  <label>Date</label>
  <input type="date" id="dateChant" required>

  <label>Description</label>
  <textarea id="description" placeholder="détails des travaux, p.ex:&#10désherbage -hh:mm,&#10tonte -hh:mm,&#10taille du liquidambar -hh:mm" required></textarea>

  <label>Volume déchets (en litres)</label>
  <input type="number" id="volume" placeholder="sac noir = 200L, sac blanc = 400L, remorque = 1m³" required>

  <label>Temps utilisation broyeur (en heures)</label>
  <input type="time" id="broyeur" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <label>Temps utilisation machines (en heures)</label>
  <input type="time" id="machines" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <button type="submit" class="btn-envoyer">Envoyer</button>
  <!--
  <button type="button" class="btn-envoyer" onclick="sendChantier()">Envoyer</button>
  -->
</form>
  
<!-- FORMULAIRE HEURES -->
<form id="formHeures" class="theme-heures" onsubmit="event.preventDefault(); sendHeures();">
  <h3>Heures</h3>

  <label>Ton nom</label>
  
  <select id="collegueHeures" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected>Lev Bronstein</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg">Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael">Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (précise cette info dans le champs Détails)</option>
  </select>
  <!--
  disabled : L'utilisateur ne peut pas recliquer dessus dans la liste.
  selected : Elle s'affiche en premier à l'ouverture de la page.
  hidden : Elle n'apparaît pas dans la liste déroulante une fois celle-ci ouverte. 
  -->

  <label>Date</label>
  <input type="date" id="dateHeures" required>

  <label>Heure du début (matin)</label>
  <input type="time" id="debut1">

  <label>Heure de fin (matin)</label>
  <input type="time" id="fin1">

  <label>Heure de début (après-midi)</label>
  <input type="time" id="debut2">

  <label>Heure de fin (après-midi)</label>
  <input type="time" id="fin2">
  
  <label>Détails par rapport aux heures</label>
  <textarea id="detailsHeures" placeholder="temps de pause ou autres"></textarea>

  <label>Infos complémentaires pour la journée</label>
  <textarea id="complementsHeures" placeholder="km trajet, tickets repas, indemnité picnic, achats divers"></textarea>

  <button type="submit" class="btn-envoyer">Envoyer</button>
  <!--
  <button type="button" class="btn-envoyer" onclick="sendHeures()">Envoyer</button>
  -->
</form>

<!-- FORMULAIRE COMPLEMENTS -->
<form id="formComplements" class="theme-complements" onsubmit="event.preventDefault(); genererRapport();">
  <h3>Rapports</h3>

  <label>Ton nom</label>
  
  <select id="collegueComp" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected>Friedrich Engels</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg">Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael">Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (il n'y a malheureusement pas de solution pour voir tes heures actuellement...)</option>
  </select>  
  <!--
  disabled : L'utilisateur ne peut pas recliquer dessus dans la liste.
  selected : Elle s'affiche en premier à l'ouverture de la page.
  hidden : Elle n'apparaît pas dans la liste déroulante une fois celle-ci ouverte. 
  -->

  <label>Date de début de la période</label>
  <input type="date" id="dateDebComp" required>

  <label>Date de fin de la période</label>
  <input type="date" id="dateFinComp" required>
  
  <button type="submit" class="btn-envoyer">Générer le rapport</button>
  <!--
  <button type="button" class="btn-envoyer" onclick="sendComplements()">Envoyer</button>
  -->

  <!-- Zone où le texte généré va apparaître -->
  <label>Rapport</label>
  <div id="resultatRapport">Le rapport s'affichera ici...</div>
  <!--
  <textarea id="resultatRapport" placeholder="Le rapport s'affichera ici..." style="background-color: #fff; border: 1px solid #ccc; min-height: 200px;" readonly></textarea>
  -->
  
  <button type="button" class="btn-effacer" onclick="effacerRapport()">Tout effacer</button>

</form>

<div id="message"></div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzwsg6saue8uhJ_HFnaxy6Wh7yMkiH-eXXzMGE-eZ4CFs1QN3ZLPeS9-QZF4nHjrUAt/exec";

function showForm(type) {
  // Masquage propre de tous les blocs
  document.getElementById("message").innerText = "";
  document.getElementById("formChantier").style.display = "none";
  document.getElementById("formHeures").style.display = "none";
  document.getElementById("formComplements").style.display = "none";
  
  // Structure if/else nettoyée de toute écriture parasite
  if (type === "chantier") {
    document.getElementById("formChantier").style.display = "block";
  } else if (type === "heures") {
    document.getElementById("formHeures").style.display = "block";
  } else if (type === "complements") {
    document.getElementById("formComplements").style.display = "block";
  }
}

  // SCRIPT D'AUTO-AGRANDISSEMENT DES TEXTAREA
document.querySelectorAll('textarea').forEach(textarea => {
  textarea.addEventListener('input', function() {
    this.style.height = 'auto'; // Réinitialise la hauteur
    this.style.height = this.scrollHeight + 'px'; // Applique la hauteur réelle du contenu inséré
  });
});

function sendChantier() {
  document.getElementById("message").innerText = "Envoi du chantier en cours...";
  const param = {
    type: "chantier",
    nom: document.getElementById("collegueChant").value,
    avec: document.getElementById("collegueAutreChant").value,
    client: document.getElementById("client").value,
    lieu: document.getElementById("lieu").value,
    date: document.getElementById("dateChant").value,
    description: document.getElementById("description").value,
    volume: document.getElementById("volume").value,
    broyeur: document.getElementById("broyeur").value,
    machines: document.getElementById("machines").value
  };
  fetch(scriptURL, { method: "POST", body: JSON.stringify(param) })
    .then(res => res.json())
    .then(() => {
      document.getElementById("message").innerText = "Chantier enregistré avec succès !";
      document.getElementById("formChantier").reset();
    })
    .catch(() => document.getElementById("message").innerText = "Erreur lors de l'enregistrement.");
}
    
function sendHeures() {
  document.getElementById("message").innerText = "Envoi des heures en cours...";
  const param = {
    type: "heures",
    nom: document.getElementById("collegueHeures").value,
    date: document.getElementById("dateHeures").value,
    debut1: document.getElementById("debut1").value,
    fin1: document.getElementById("fin1").value,
    debut2: document.getElementById("debut2").value,
    fin2: document.getElementById("fin2").value,
    details: document.getElementById("detailsHeures").value,
    complements: document.getElementById("complementsHeures").value
  };
  fetch(scriptURL, { method: "POST", body: JSON.stringify(param) })
    .then(res => res.json())
    .then(() => {
      document.getElementById("message").innerText = "Heures enregistrées avec succès !";
      document.getElementById("formHeures").reset();
    })
    .catch(() => document.getElementById("message").innerText = "Erreur lors de l'enregistrement.");
}

function genererRapport() {
  
  //alert("Étape 1 : Le bouton a bien détecté le clic !");
  
  const divResultat = document.getElementById("resultatRapport");
  
  /*if (!divResultat) {
    alert("ERREUR : L'élément HTML 'resultatRapport' est introuvable dans la page !");
    return;
  }*/

  //alert("Étape 2 : Les boîtes d'affichage existent bien dans la page.");

  const nom = document.getElementById("collegueComp").value;
  const debut = document.getElementById("dateDebComp").value;
  const fin = document.getElementById("dateFinComp").value;

  //alert("Étape 3 : Valeurs lues -> Nom: " + nom + " | Début: " + debut + " | Fin: " + fin);

  divResultat.innerHTML = "<em>Calcul et génération du rapport quotidien en cours...</em>";

  const param = {
    action: "genererRapport",
    nom: nom,
    debut: debut,
    fin: fin
  };

  //alert("Étape 4 : Connexion au Google Sheet en cours via : " + scriptURL);

  fetch(scriptURL, { method: "POST", body: JSON.stringify(param) })
  /*.then(res => {
    alert("Étape 5 : Le serveur Google Sheet a répondu ! Traitement des données...");
    return res.json();
  })*/
  .then(res => res.json())
  .then(data => {
    //alert("Étape 6 : Données reçues avec le statut : " + data.status);
    if (data.status === "success") {
      divResultat.innerHTML = data.html; 
    } else {
      divResultat.innerHTML = "<span style='color:red;'>Erreur retournée par Google : " + data.message + "</span>";
    }
  })
  .catch((erreur) => {
    //alert("Étape ÉCHEC : La connexion a échoué. Détails : " + erreur.message);
    divResultat.innerHTML = "<span style='color:red;'>Erreur de connexion. Vérifiez le réseau.</span>";
  });
}

  function effacerRapport() {
    document.getElementById("formComplements").reset();
    const divResultat = document.getElementById("resultatRapport");
    if(divResultat) divResultat.innerHTML = "";
  }
  
  document.querySelectorAll('textarea').forEach(textarea => {
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
  });

  
</script>
