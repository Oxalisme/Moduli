<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Formulaires</title>
  
<!-- Images du raccourci écran d'accueil et favicon -->
<link rel="apple-touch-icon" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">
<link rel="icon" type="image/png" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">

<style>
  
/* CORRECTION LARGEUR : Force tous les éléments à respecter strictement les 100% */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
}

form {
  display: none;
  margin-top: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}
  
/*style de base pour TOUS les boutons*/
button {
  width: 100%;
  padding: 20px;
  margin: 10px 0;
  font-size: 30px;
  border-radius: 12px;
  cursor: pointer;
}
  
}
input, textarea, select, div {
  font-family: Arial, sans-serif;
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 24px;
  border-radius: 12px;
  resize: none; /* Désactive la poignée manuelle pour laisser le script gérer la hauteur */
  overflow-y: hidden; 
}
textarea {
  min-height: 100px;
}
  
/* Force la même police et le même style pour TOUS les placeholders */
input::placeholder, 
textarea::placeholder {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Grise le texte du select UNIQUEMENT quand l'option par défaut (vide) est sélectionnée */
select:invalid {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Remet le texte en noir normal dès qu'une vraie option est choisie */
select:valid {
  color: black;
  font-family: Arial, sans-serif;
}  
  
/* Surligne en rouge le champ obligatoire non rempli ou mal rempli
  NE MARCHE PAS <- mais je l'avais mis dans Label */
input:user-invalid, 
textarea:user-invalid, 
select:user-invalid {
  border: 3px solid #DC2626 !important; /* Rouge vif d'alerte */
}
  
#message {
  margin-top: 20px;
  font-weight: bold;
  color: green;
}
  
/* 1. THÈME CHANTIER (Rouge / Rose) */
  /* .theme-chantier, */
.theme-chantier input, 
.theme-chantier textarea, 
.theme-chantier select {
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
}

/* 2. THÈME HEURES (Vert) */
  /* .theme-heures, */
.theme-heures input, 
.theme-heures textarea, 
.theme-heures select {
  background-color: #ECFDF5;
  border: 1px solid #016630;
}

/* 3. THÈME COMPLÉMENTS (Bleu) */
  /* .theme-complements, */
.theme-complements input, 
.theme-complements textarea, 
.theme-complements select {
  background-color: #EFF6FF;
  border: 1px solid #193CB8;
}

/* 4. BOUTONS D'ENVOI (Jaune) */
button.btn-envoyer, button.btn-effacer {
  background-color: #FEFCE8 !important;
}
/* On force la bordure du bouton d'envoi à correspondre à son formulaire parent */
.theme-chantier button.btn-envoyer { border: 1px solid #9F0712; }
.theme-heures button.btn-envoyer { border: 1px solid #016630; }
.theme-complements button.btn-envoyer { border: 1px solid #193CB8; }

</style>
<script src="https://jsdelivr.net"></script>

<button onclick="showForm('chantier')" style="background-color: #FEF2F2; border: 1px solid #9F0712;">Chantier</button>
<button onclick="showForm('heures')" style="background-color: #ECFDF5; border: 1px solid #016630;">Heures</button>
<button onclick="showForm('complements')" style="background-color: #EFF6FF; border: 1px solid #193CB8;">NE PAS UTILISER</button>

<!-- FORMULAIRE CHANTIER -->

<form id="formChantier" class="theme-chantier">
  <h3>Chantier</h3>

  <label>Ton nom</label>
  
  <select id="collegueChant" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected hidden>Le Pape ?</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg" selected>Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael" selected>Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (précise cette info dans le champs ci-dessous)</option>
  </select>
  <!--
  disabled : L'utilisateur ne peut pas recliquer dessus dans la liste.
  selected : Elle s'affiche en premier à l'ouverture de la page.
  hidden : Elle n'apparaît pas dans la liste déroulante une fois celle-ci ouverte. 
  -->

  <label>Avec qui tu as travaillé sur le chantier</label>
  <input type="text" id="collegueAutreChant">

  <label>Nom du client</label>
  <input type="text" id="client" required>

  <label>Lieu</label>
  <input type="text" id="lieu" placeholder="adresse ou précision p.ex. concernant les 4 maisons de Chloé" required>

  <label>Date</label>
  <input type="date" id="dateChant" required>

  <label>Description</label>
  <textarea id="description" placeholder="détails des travaux, p.ex:&#10désherbage -hh:mm,&#10tonte -hh:mm,&#10taille du liquidambar -hh:mm" required></textarea>

  <label>Volume déchets (en litres)</label>
  <input type="number" id="volume" placeholder="sac noir = 200L, sac blanc = 400L, remorque = 1m³" required>

  <label>Temps utilisation broyeur (en heures)</label>
  <input type="time" id="broyeur" style="background-color: #FEF2F2; border: 1px solid #9F0712;" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <label>Temps utilisation machines (en heures)</label>
  <input type="time" id="machines" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <!--
    <button type="submit" class="btn-envoyer">Envoyer</button>
-->
  <button type="button" class="btn-envoyer" onclick="sendChantier()">Envoyer</button>
</form>

</form>

    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (il n'y a malheureusement pas de solution pour voir tes heures actuellement...)</option>
  </select>

  selected : Elle s'affiche en premier à l'ouverture de la page.

  <!--
  <label>Détails</label>

  -->

<div id="message"></div>

function showForm(type) {
  // Masquage propre de tous les blocs
  document.getElementById("formChantier").style.display = "none";
  document.getElementById("formHeures").style.display = "none";
  document.getElementById("formComplements").style.display = "none";
  
  // Structure if/else nettoyée de toute écriture parasite
  if (type === "chantier") {
    document.getElementById("formChantier").style.display = "block";
  } else if (type === "heures") {
    document.getElementById("formHeures").style.display = "block";
  } else if (type === "complements") {
    document.getElementById("formComplements").style.display = "block";
  }
}

  // SCRIPT D'AUTO-AGRANDISSEMENT DES TEXTAREA
document.querySelectorAll('textarea').forEach(textarea => {
  textarea.addEventListener('input', function() {

    this.style.height = this.scrollHeight + 'px'; // Applique la hauteur réelle du contenu inséré
  });
});

function genererRapport() {
  const nom = document.getElementById("collegueComp").value;
  const dateDebut = document.getElementById("dateDebComp").value;
  const dateFin = document.getElementById("dateFinComp").value;
  const divResultat = document.getElementById("resultatRapport");
  
  if (!nom || !dateDebut || !dateFin) {
    alert("Veuillez remplir le nom et les deux dates.");
    return;
  }

  divResultat.innerHTML = "<em>Calcul et génération du rapport en cours...</em>";
  
  // Préparation des données à envoyer
  const param = {
    action: "genererRapport",
    nom: nom,
    debut: dateDebut,
    fin: dateFin
  };

  // Envoi de la requête au Google Script
  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(param)
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === "success") {
      // traduire le Md en joli HTML
      divResultat.innerHTML = marked.parse(data.markdown);
/*      // Force l'auto-agrandissement du textarea après l'insertion du texte
      textareaResultat.style.height = 'auto';
      textareaResultat.style.height = textareaResultat.scrollHeight + 'px';   */
    } else {
      divResultat.innerHTML = "<span style='color:red;'>Erreur : " + data.message + "</span>";
    }
  })
  .catch(error => {
    textareaResultat.value = "Erreur de connexion au serveur.";
    console.error(error);
  });
}

  function effacerRapport() {
    document.getElementById("formComplements").reset();
    document.getElementById("resultatRapport").innerHTML = "";
    document.getElementById("zoneRapport").style.display = "none";
  }
  
  // Auto-agrandissement des textarea restants
  document.querySelectorAll('textarea').forEach(textarea => {
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
  });

  
</script>
