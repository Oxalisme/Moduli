<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Heures Moduli</title>
  
<!-- Images du raccourci écran d'accueil et favicon -->
<!-- Images du raccourci écran d'accueil et favicon -->
  <!--
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Oxalisme/Moduli/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Oxalisme/Moduli/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">
-->
  
<link rel="manifest" href="manifest.json">
  
<!-- Meta viewport pour s'assurer que le site s'affiche bien sur mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<meta name="application-name" content="Heures Moduli">
<meta name="theme-color" content="#FEF2F2">

<!-- Couleur de la barre d'état iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  
<!-- Nom du raccourci sur le téléphone -->
<meta name="apple-mobile-web-app-title" content="Heures Moduli">
  
<style>
  
/* CORRECTION LARGEUR : Force tous les éléments à respecter strictement les 100% */
*, *::before, *::after {
  box-sizing: border-box;
  
  /* FORCE LE SMARTPHONE À RESPECTER STRICTEMENT VOS TAILLES DE POLICE */
  -webkit-text-size-adjust: none; /* Pour Safari / iOS */
  -moz-text-size-adjust: none;    /* Pour Firefox mobile */
  text-size-adjust: none;         /* Règle standard */
}

body {
  font-family: 'Ubuntu Sans', regular;
  padding: 20px;
}

form {
  display: none;
  margin-top: 20px;
}

label {
  font-family: 'Ubuntu Sans', regular;
  font-weight: bold;
  display: block;
  margin-top: 15px;
  /* CRÉE UNE BARRIÈRE VISUELLE POUR IMPOSER L'ADDITION DES MARGES */
  padding-top: 0.1px; 
  font-size: 16px !important;
}
  
/*style de base pour TOUS les boutons*/
button {
  width: 100%;
  padding: 20px;
  margin: 10px 0;
  font-size: 30px;
  border-radius: 12px;
  cursor: pointer;
}
  
input, textarea, select, div, #resultatRapport {
  font-family: 'Ubuntu Sans', regular;
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 24px;
  border-radius: 12px;
  resize: none; /* Désactive la poignée manuelle pour laisser le script gérer la hauteur */
  overflow-y: hidden; 
}
textarea, #resultatRapport {
  min-height: 100px;
}
  
/* Force la même police et le même style pour TOUS les placeholders */
input::placeholder, 
textarea::placeholder {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Grise le texte du select UNIQUEMENT quand l'option par défaut (vide) est sélectionnée */
select:invalid {
  font-family: monospace;
  color: rgba(0, 0, 0, 0.4);
}
/* Remet le texte en noir normal dès qu'une vraie option est choisie */
select:valid {
  color: black;
  font-family: 'Ubuntu Sans', regular;
}  
  
/* Surligne en rouge le champ obligatoire non rempli ou mal rempli */
input:user-invalid, 
textarea:user-invalid, 
select:user-invalid {
  border: 3px solid #DC2626 !important; /* Rouge vif d'alerte */
}
  
#message {
  margin-top: 20px;
  font-weight: bold;
  color: green;
}
  
/* 1. THÈME CHANTIER (Rouge / Rose) */
  /* .theme-chantier, */
.theme-chantier input, 
.theme-chantier textarea, 
.theme-chantier select {
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
}

/* 2. THÈME HEURES (Vert) */
  /* .theme-heures, */
.theme-heures input, 
.theme-heures textarea, 
.theme-heures select {
  background-color: #ECFDF5;
  border: 1px solid #016630;
}

/* 3. THÈME COMPLÉMENTS (Bleu) */
  /* .theme-complements, */
.theme-complements input, 
.theme-complements textarea, 
.theme-complements select,
#resultatRapport {
  background-color: #EFF6FF;
  border: 1px solid #193CB8;
}

/* 4. BOUTONS D'ENVOI (Jaune) */
button.btn-envoyer, button.btn-effacer {
  background-color: #FEFCE8 !important;
}
/* On force la bordure du bouton d'envoi à correspondre à son formulaire parent */
.theme-chantier button.btn-envoyer { border: 1px solid #9F0712; }
.theme-heures button.btn-envoyer { border: 1px solid #016630; }
.theme-complements button.btn-envoyer, 
.theme-complements button.btn-effacer { border: 1px solid #193CB8; }

/* Permet de mettre deux champs côte à côte */
.ligne-champs-cote-cote {
  display: inline-flex;
  gap: 15px; /* Espace entre les deux blocs */
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important; /* Annule le padding global du div */
  border: none !important;
  background: none !important;
  font-size: unset !important; /* Annule la taille de police globale pour ce div */
  overflow: visible !important; /* CORRECTION : Empêche de couper l'outline du focus */
  margin-bottom: 10px !important;
}

.ligne-champs-cote-cote .groupe-champ {
  flex: 1; /* Donne la même largeur aux deux colonnes */
  display: flex;
  flex-direction: column; /* Aligne le label au-dessus de l'input */
  margin: 0 !important;
  padding: 0 !important; /* Annule le padding global du div */
  border: none !important;
  background: none !important;
  font-size: unset !important; /* Empêche le label d'hériter des 24px du div */
  overflow: visible !important; /* CORRECTION : Empêche de couper l'outline du focus */
}

/* Force la taille et les marges des inputs dans la ligne flex */
.ligne-champs-cote-cote .groupe-champ input {
  width: 100%;
  margin: 10px 0 0 0; /* Aligné sur le style de vos autres inputs */
}

/* Aligne le style du label sur vos labels d'origine */
.ligne-champs-cote-cote .groupe-champ label {
  margin-top: 15px;
  /* CRÉE UNE BARRIÈRE VISUELLE POUR IMPOSER L'ADDITION DES MARGES */
  padding-top: 0.1px; 
  display: block;
  font-size: 16px !important;
}
  
/* Conteneur global de la zone de description */
.conteneur-description-dynamique {
  width: 100% !important;
  padding: 0 !important;
  margin-top: 10px !important;
  margin-bottom: 10px !important;
  border: none !important;
  background: none !important;
  overflow: visible !important;
}
/* Ligne flexible */
.ligne-description {
  display: inline-flex;
  align-items: center; /* Aligne le milieu de l'input et du time */
  gap: 15px;
  width: 100% !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  overflow: visible !important;
  margin: 0 0 10px 0 !important;
}

/* Répartition 80% / 20% */
.ligne-description .champ-texte {
  flex: 4; 
  min-width: 0;
}

.ligne-description .bloc-heure {
  flex: 1;
  min-width: 110px;
  display: flex;
  flex-direction: column;
  padding: 0 !important;
  margin: 0 !important;
  border: none !important;
  background: none !important;
  font-size: unset !important;
  overflow: visible !important;
}
/* Force les inputs de la description à respecter le thème sans marges gênantes */
.theme-chantier .ligne-description input.champ-texte,
.theme-chantier .ligne-description textarea.champ-texte {
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
  width: 100%;
  margin: 0 !important; /* Supprime le margin global de 10px qui brise l'alignement flex */
}

/* Centre le champ d'heures uniquement sur son propre axe vertical */
.ligne-description .bloc-heure input.champ-heure {
  margin: 0 !important;
  align-self: center; /* S'assure qu'il s'aligne sur le milieu vertical de la zone initiale */
}

/* Première ligne : kilométrage, ticket repas et pique-nique */
.frais-ligne-1 {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  width: 100% !important;
  margin: 0 0 10px 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  font-size: unset !important;
  overflow: visible !important;
}

/* Les trois colonnes ont la même structure */
.frais-ligne-1 .groupe-frais-km,
.frais-ligne-1 .groupe-frais-ticket,
.frais-ligne-1 .groupe-frais-picnic {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  font-size: unset !important;
  overflow: visible !important;
}

/* Les trois labels occupent la même hauteur */
.frais-ligne-1 label {
  display: flex;
  align-items: flex-start;
  height: 38px;
  min-height: 38px;
  margin: 15px 0 0 0 !important;
  padding: 0.1px 0 0 0;
  font-size: 16px !important;
  font-weight: bold;
  box-sizing: border-box;
}

/* Les deux champs numériques commencent à la même hauteur */
.frais-ligne-1 input[type="number"],
.frais-ligne-1 input[type="text"] {
  width: 100%;
  min-width: 0;
  margin: 0 !important;
}

/* Le conteneur du pique-nique s'aligne sur les deux champs */
.frais-ligne-1 .groupe-frais-picnic > div {
  width: 100%;
  height: 50.4px;
  min-height: 50.4px;
  margin: 0 !important;
  padding: 10px !important;
  border: 1px solid #016630 !important;
  background-color: transparent !important;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  font-size: 16px !important;
  font-weight: normal;
  box-sizing: border-box;
}

/* La case à cocher conserve sa taille naturelle */
.frais-ligne-1 .groupe-frais-picnic input[type="checkbox"] {
  width: auto;
  height: auto;
  margin: 0 !important;
  padding: 0 !important;
}

/* Deuxième ligne pour "achats autres" avec ligne dynamique */
.frais-ligne-2 {
display: flex;
flex-direction: column;
width: 100% !important;
margin: 0 !important;
padding: 0 !important;
border: none !important;
background: none !important;
font-size: unset !important;
overflow: visible !important;
}

.frais-ligne-2 label {
margin-top: 15px;
padding-top: 0.1px;
display: block;
font-size: 16px !important;
font-weight: bold;
}

/* Zone contenant les lignes d'achats autres dynamiques */
.conteneur-achats-autres {
width: 100% !important;
padding: 0 !important;
margin-top: 10px !important;
margin-bottom: 10px !important;
border: none !important;
background: none !important;
overflow: visible !important;
}

/* Une ligne d'achat autre */
.ligne-achat-autre {
display: inline-flex;
gap: 15px;
width: 100% !important;
padding: 0 !important;
border: none !important;
background: none !important;
font-size: unset !important;
overflow: visible !important;
margin: 0 0 10px 0 !important;
align-items: flex-start;
}

.ligne-achat-autre .bloc-montant {
flex: 1;
display: flex;
flex-direction: column;
margin: 0 !important;
padding: 0 !important;
border: none !important;
background: none !important;
font-size: unset !important;
overflow: visible !important;
}

.ligne-achat-autre .bloc-description {
flex: 2;
display: flex;
flex-direction: column;
margin: 0 !important;
padding: 0 !important;
border: none !important;
background: none !important;
font-size: unset !important;
overflow: visible !important;
}

.ligne-achat-autre .bloc-montant input[type="number"] {
width: 100%;
margin: 0 !important;
padding: 10px;
font-size: 24px;
background-color: #ECFDF5;
border: 1px solid #016630;
border-radius: 12px;
}

.ligne-achat-autre .bloc-description input[type="text"],
.ligne-achat-autre .bloc-description textarea {
width: 100%;
margin: 0 !important;
padding: 10px;
font-size: 24px;
background-color: #ECFDF5;
border: 1px solid #016630;
border-radius: 12px;
}

/* Conteneur global des matériaux */
.conteneur-materiaux {
  width: 100% !important;
  margin: 10px 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  overflow: visible !important;
}

/* Ensemble d'un matériau : description + détails */
.ligne-materiau {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100% !important;
  margin: 0 0 20px 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  font-size: unset !important;
  overflow: visible !important;
}

/* Première ligne : description */
.bloc-description-materiau {
  width: 100%;
  min-width: 0;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  overflow: visible !important;
}

/* Champ de description */
.theme-chantier .champ-texte-materiau {
  width: 100%;
  min-width: 0;
  margin: 0 !important;
  padding: 10px;
  font-size: 24px;
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
  border-radius: 12px;
  resize: none;
  overflow: hidden;
}

/* Deuxième ligne : quantité, unité et prix */
.ligne-details-materiau {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  font-size: unset !important;
  overflow: visible !important;
}

/* Les trois colonnes occupent chacune un tiers de l'espace */
.bloc-quantite-materiau,
.bloc-unite-materiau,
.bloc-prix-materiau {
  flex: 1;
  min-width: 0;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
  overflow: visible !important;
}

/* Champs de quantité, unité et prix */
.theme-chantier .champ-quantite-materiau,
.theme-chantier .champ-unite-materiau,
.theme-chantier .champ-prix-materiau {
  display: block;
  width: 100%;
  min-width: 0;
  margin: 0 !important;
  padding: 10px 5px;
  font-size: 24px;
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
  border-radius: 12px;
}

/* La description peut devenir un textarea */
.theme-chantier textarea.champ-texte-materiau {
  display: block;
  min-height: 46px;
  height: 46px;
  line-height: normal;
  resize: none;
  overflow-y: hidden;
}

  
</style>
</head>
<body>

<h2>Choisir un formulaire</h2>

<button onclick="showForm('chantier')" style="background-color: #FEF2F2; border: 1px solid #9F0712;">Chantier</button>
<button onclick="showForm('heures')" style="background-color: #ECFDF5; border: 1px solid #016630;">Heures</button>
<button onclick="showForm('complements')" style="background-color: #EFF6FF; border: 1px solid #193CB8;">Rapport des heures</button>

<!-- FORMULAIRE CHANTIER -->
<form id="formChantier" class="theme-chantier" onsubmit="event.preventDefault(); sendChantier();">
<!--
<form id="formChantier" class="theme-chantier">
-->
  <h3>Chantier</h3>

  <label>Ton nom</label>
  
  <select id="collegueChant" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected>Vladimir Oulianov</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="gabriel">Gabriel</option>
    <option value="greg">Greg</option>
    <option value="juan">Juan</option>
        <!--
        <option value="laura">Laura</option>
        -->
        <option value="laure">Laure</option>
        <option value="mickael">Mickaël</option>
        <option value="nico">Nico</option>
        <option value="oxa">Oxa</option>
        <!--
        <option value="sam_hannes">Sam Lebelge</option>
        -->
    <option value="sam_evequoz">Sam</option>
    <option value="other">AUTRE (précise cette info dans le champs ci-dessous)</option>
  </select>
  <!--
  disabled : L'utilisateur ne peut pas recliquer dessus dans la liste.
  selected : Elle s'affiche en premier à l'ouverture de la page.
  hidden : Elle n'apparaît pas dans la liste déroulante une fois celle-ci ouverte. 
  -->

  <label>Avec qui tu as travaillé sur le chantier</label>
  <input type="text" id="collegueAutreChant">

  <label>Nom du client</label>

  <div class="groupe-client" style="background-color: transparent; border: 1px solid #9F0712;">
    <!-- Option 1 : Choisir parmi une liste -->
    <div style="margin-bottom: 10px;">
      <label style="display: flex; align-items: center; font-weight: normal; margin-top: 10px;">
        <input type="radio" name="typeClient" value="select" onchange="gererTypeClient()" style="width: auto; margin: 0 10px 0 0;">
        Client régulier
      </label>
      <select id="clientSelect" name="client" style="display: none;" required>
        <option value="" disabled selected>Gueorgui Plekhanov</option>
        <option value="depot">Dépôt</option>
        <option value="Gauthey">Gauthey (Signal 9)</option>
        <option value="Godelle">Godelle</option>
        <option value="Imhof">Imhof</option>
        <option value="Maye">Maye (Branche 10)</option>
        <option value="Miauton">Miauton</option>
        <option value="Mundler">Mundler</option>
        <option value="Morard">Morard (Palézieux)</option>
        <option value="Perret">Perret</option>
        <option value="Perreten">Perreten</option>
        <option value="Sylvie">Sylvie</option>
        <option value="Vuffray">Vuffray</option>
        <option value="Burenoz3">Chloé NICO (Burenoz 3)</option>
        <option value="Crinoline">Chloé CRINO (& Petit-Clos)</option>
        <option value="Paquis4">Chloé ROSIERS (Pâquis 4)</option>
        <option value="Sallin">Chloé SALLIN</option>
        <option value="Chloe">Chloé CHARDONNE</option>
      </select>
    </div>
  
    <!-- Option 2 : Entrer manuellement -->
    <div style="margin-bottom: 10px;">
      <label style="display: flex; align-items: center; font-weight: normal; margin-top: 10px;">
        <input type="radio" name="typeClient" value="text" onchange="gererTypeClient()" style="width: auto; margin: 0 10px 0 0;">
        Autre client
      </label>
      <input type="text" id="clientText" style="display: none;" placeholder="Nom du client">
    </div>
  </div>
  
  <!--
  <label>Nom du client</label>
  <input type="text" id="client" required>
  -->

  <label>Lieu</label>
  <input type="text" id="lieu" placeholder="adresse ou précision" required>

  <label>Date</label>
  <input type="date" id="dateChant" required>
  
  <!-- DEBUT DES DEUX CHAMPS CÔTE À CÔTE -->
  <div class="ligne-champs-cote-cote">
    <div class="groupe-champ">
      <label for="heureDebut">Début du chantier</label>
      <input type="time" id="heureDebChant" min="05:00" required>
    </div>
    
    <div class="groupe-champ">
      <label for="heureFin">Fin du chantier</label>
      <input type="time" id="heureFinChant" min="08:00" required>
    </div>
  </div>
  <!-- FIN DES DEUX CHAMPS CÔTE À CÔTE -->
  
  <label>Description du chantier par activités (marquer l'heure de fin de l'activité)</label>
  <div id="zoneDescription" class="conteneur-description-dynamique">
    <!-- La première ligne de description -->
    <div class="ligne-description">
      <input type="text" class="champ-texte" placeholder="Détails de l'activité, ci-après l'heure de fin" oninput="gererLignesDescription(event)" required>
      <div class="bloc-heure">
        <!--<label class="label-heure">Temps</label>-->
        <input type="time" class="champ-heure" oninput="gererLignesDescription(event)" required>
      </div>
    </div>
  </div>

  <label>Matériaux utilisés</label>
  
  <div id="zoneMateriaux" class="conteneur-materiaux">
    <!-- Première ligne de matériau -->
    <div class="ligne-materiau">
      <!-- Ligne 1 : description -->
      <div class="bloc-description-materiau">
        <input
          type="text"
          class="champ-texte-materiau"
          placeholder="Description du matériau"
          oninput="gererLigneMateriaux(event)"
        >
      </div>
  
      <!-- Ligne 2 : quantité, unité et prix -->
      <div class="ligne-details-materiau">
        <div class="bloc-quantite-materiau">
          <input
            type="number"
            class="champ-quantite-materiau"
            placeholder="Quantité"
            step="any"
            oninput="gererLigneMateriaux(event)"
          >
        </div>
        <div class="bloc-unite-materiau">
          <input
            type="text"
            class="champ-unite-materiau"
            placeholder="Unité"
            oninput="gererLigneMateriaux(event)"
          >
        </div>
        <div class="bloc-prix-materiau">
          <input
            type="number"
            class="champ-prix-materiau"
            placeholder="Prix CHF"
            step="0.01"
            oninput="gererLigneMateriaux(event)"
          >
        </div>
      </div>
    </div>
  </div>
  
  <label>Volume déchets (en litres)</label>
  <input type="number" id="volume" placeholder="EN LITRES, sac noir = 200L, sac blanc = 400L, remorque = 3000L" required>

  <label>Temps utilisation broyeur (en minutes)</label>
  <input type="number" id="broyeur" placeholder="EN MINUTES, de préférence arrondi au quart d'heure" required>

  <label>Temps utilisation machines (en minutes)</label>
  <input type="number" id="machines" placeholder="EN MINUTES, de préférence arrondi au quart d'heure" required>

  <button type="submit" class="btn-envoyer">Envoyer</button>
  <!--
  <button type="button" class="btn-envoyer" onclick="sendChantier()">Envoyer</button>
  -->
</form>
  
<!-- FORMULAIRE HEURES -->
<form id="formHeures" class="theme-heures" onsubmit="event.preventDefault(); sendHeures();">
  <h3>Heures</h3>

  <label>Ton nom</label>
  
  <select id="collegueHeures" name="nom" required>
  <!-- Cette option sert de placeholder -->
    <option value="" disabled selected>Lev Bronstein</option>
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="gabriel">Gabriel</option>
    <option value="greg">Greg</option>
    <option value="juan">Juan</option>
    <!--
    <option value="laura">Laura</option>
    -->
    <option value="laure">Laure</option>
    <option value="mickael">Mickaël</option>
    <option value="nico">Nico</option>
    <option value="oxa">Oxa</option>
    <!--

function genererRapport() {
  const divResultat = document.getElementById("resultatRapport");
  
  // Récupère le type sélectionné (collegue ou client)
  const typeChoisi = document.querySelector('input[name="typeRapport"]:checked')?.value;
  let nom = "";
  let typeRapport = "";
  
  if (typeChoisi === 'collegue') {
    // C'est un collegue
    nom = document.getElementById("collegueCompSelect").value;
    typeRapport = "collegue";
  } else if (typeChoisi === 'client') {
    // C'est un client
    nom = document.getElementById('clientCompSelect').value;
    typeRapport = "client";
  }
  
  const debut = document.getElementById("dateDebComp").value;
  const fin = document.getElementById("dateFinComp").value;

  divResultat.innerHTML = "<em>Calcul et génération du rapport quotidien en cours...</em>";

  const param = {
    action: "genererRapport",
    nom: nom,
    typeRapport: typeRapport, // Nouveau paramètre pour différencier
    debut: debut,
    fin: fin
  };

  fetch(scriptURL, { method: "POST", body: JSON.stringify(param) })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      divResultat.innerHTML = data.html; 
    } else {
      divResultat.innerHTML = "<span style='color:red;'>Erreur retournée par Google : " + data.message + "</span>";
    }
  })
  .catch((erreur) => {
    divResultat.innerHTML = "<span style='color:red;'>Erreur de connexion. Vérifiez le réseau.</span>";
  });
}

// Fonction magique qui ajuste la hauteur du textarea selon son contenu
function ajusterHauteur(textarea) {
  textarea.style.setProperty('height', 'auto', 'important');
  // Si le contenu est plus petit ou égal à une ligne, on le force à rester à 46px
  if (textarea.scrollHeight <= 46) {
    textarea.style.setProperty('height', '46px', 'important');
  } else {
    textarea.style.setProperty('height', textarea.scrollHeight + 'px', 'important');
  }
}

function gererLignesDescription(event) {
  const el = event.target;

  // Si l'utilisateur tape du texte dans un input classique
  if (el && el.tagName === 'INPUT' && el.classList.contains('champ-texte')) {
    // Si le texte commence à déborder de la largeur visible du champ
    if (el.scrollWidth > el.clientWidth) {
      const textarea = document.createElement('textarea');
      textarea.className = el.className;
      textarea.placeholder = el.placeholder;
      textarea.value = el.value;
      textarea.setAttribute('oninput', 'gererLignesDescription(event)');
      
      el.parentNode.replaceChild(textarea, el);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      
      // Force le comportement fluide immédiatement
      textarea.style.setProperty('height', 'auto', 'important');
      textarea.style.setProperty('height', textarea.scrollHeight + 'px', 'important');
    }
  }
  // Si c'est déjà un textarea, on gère son agrandissement classique
  else if (el && el.tagName === 'TEXTAREA') {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // LOGIQUE DE CRÉATION DE NOUVELLE LIGNE À L'INFINI
  const zone = document.getElementById('zoneDescription');
  const lignes = zone.getElementsByClassName('ligne-description');
  const derniereLigne = lignes[lignes.length - 1];
  
  const inputTexte = derniereLigne.querySelector('.champ-texte');
  const inputHeure = derniereLigne.querySelector('.champ-heure');

  if (inputTexte.value.trim() !== "" || inputHeure.value !== "") {
    const nouvelleLigne = document.createElement('div');
    nouvelleLigne.className = 'ligne-description';
    nouvelleLigne.innerHTML = `
      <input type="text" class="champ-texte" placeholder="Détails de l'activité" oninput="gererLignesDescription(event)">
      <div class="bloc-heure">
        <input type="time" class="champ-heure" oninput="gererLignesDescription(event)">
      </div>
    `;
    zone.appendChild(nouvelleLigne);
  }
}

function gererLigneMateriaux(event) {
  const el = event.target;
  // 1. Transformer le champ de description en textarea
  // si le texte dépasse la largeur visible.
  if (

    el.tagName === 'INPUT' &&
    el.classList.contains('champ-texte-materiau')
  ) {
    if (el.scrollWidth > el.clientWidth) {
      const textarea = document.createElement('textarea');
      textarea.className = el.className;
      textarea.placeholder = el.placeholder;
      textarea.value = el.value;
      textarea.setAttribute(
        'oninput',
        'gererLigneMateriaux(event)'
      );
      el.parentNode.replaceChild(textarea, el);
      // Replace le curseur à la fin du texte.
      textarea.focus();
      textarea.setSelectionRange(
        textarea.value.length,
        textarea.value.length
      );

      // Ajuste immédiatement la hauteur.
      textarea.style.setProperty('height', 'auto', 'important');
      textarea.style.setProperty(
        'height',
        textarea.scrollHeight + 'px',
        'important'
      );

  }

  // 2. Adapter la hauteur si le champ est déjà un textarea.
  else if (

  if (

    quantite.value.trim() !== '' ||
    unite.value.trim() !== '' ||

}

  
// 2. Fonction à appeler AU DÉBUT de votre fonction existante sendChantier()
function compilerDescription() {
  const lignes = document.getElementsByClassName('ligne-description');
  let descriptionTotale = "";

  for (let i = 0; i < lignes.length; i++) {
    const texte = lignes[i].querySelector('.champ-texte').value.trim();
    const heure = lignes[i].querySelector('.champ-heure').value;

    // On ne prend la ligne que si elle n'est pas vide
    if (texte !== "" || heure !== "") {
      // Format : Texte + Tabulation + Heure + Retour à la ligne
      descriptionTotale += `${texte}\t${heure}\n`;
    }
  }
  
  // Enlève le dernier retour à la ligne inutile
  return descriptionTotale.trim();
}

      unite === '' &&
      prix === ''
    ) {
      continue;
    }
    // Construire la quantité avec son unité.
    const quantiteUnite = `${quantite}${unite ? ' ' + unite : ''}`;
    // Format : description, quantité unité [TAB] prix
    materiauxTotal += `${texte}, ${quantiteUnite}\tCHF${prix}\n`;
  }
  // Supprimer le dernier retour à la ligne.
  return materiauxTotal.trim();
}

  const zone = document.getElementById('zoneDescription');

// Convertit une valeur en minutes (nombre) en heures décimales
function convertirMinutesEnHeures(idElement) {
  const valeur = document.getElementById(idElement).value;
  
  // Si le champ est vide ou n'est pas un nombre, on renvoie 0
  if (!valeur || isNaN(valeur)) {
    return 0;
  }
  
  // Divise les minutes par 60 et arrondit à 2 décimales (ex: 1.25)
  return parseFloat((parseFloat(valeur) / 60).toFixed(2));
}
  
  // Gère l'affichage/masquage des champs client selon le choix
function gererTypeClient() {
  const typeChoisi = document.querySelector('input[name="typeClient"]:checked');
  const selectClient = document.getElementById('clientSelect');
  const textClient = document.getElementById('clientText');
  
  if (typeChoisi && typeChoisi.value === 'select') {
    selectClient.style.display = 'block';
    selectClient.removeAttribute('disabled');
    textClient.style.display = 'none';
    textClient.setAttribute('disabled', true);
  } else if (typeChoisi && typeChoisi.value === 'text') {
    textClient.style.display = 'block';
    textClient.removeAttribute('disabled');
    selectClient.style.display = 'none';
    selectClient.setAttribute('disabled', true);
  }
}

// Gère l'affichage/masquage des selects du formulaire Compléments selon le choix des radio buttons
function gererTypeRapport() {
  const typeChoisi = document.querySelector('input[name="typeRapport"]:checked');
  const selectCollegue = document.getElementById('collegueCompSelect');
  const selectClient = document.getElementById('clientCompSelect');
  
  if (typeChoisi && typeChoisi.value === 'collegue') {
    // Affiche le select des collègues, masque celui des clients
    selectCollegue.style.display = 'block';
    selectCollegue.removeAttribute('disabled');
    selectClient.style.display = 'none';
    selectClient.setAttribute('disabled', true);
  } else if (typeChoisi && typeChoisi.value === 'client') {
    // Affiche le select des clients, masque celui des collègues
    selectClient.style.display = 'block';
    selectClient.removeAttribute('disabled');
    selectCollegue.style.display = 'none';
    selectCollegue.setAttribute('disabled', true);
  }
}


// Modifie la fonction sendChantier pour récupérer le bon client
function sendChantier() {
  document.getElementById("message").innerText = "Envoi du chantier en cours...";
  
  // Récupère le client selon ce qui est coché
  const typeClient = document.querySelector('input[name="typeClient"]:checked')?.value;
  let client = "";
  
  if (typeClient === 'select') {
    client = document.getElementById('clientSelect').value;
  } else if (typeClient === 'text') {
    client = document.getElementById('clientText').value.trim();
  }
  
  const param = {
    type: "chantier",
    nom: document.getElementById("collegueChant").value,
    avec: document.getElementById("collegueAutreChant").value,
    client: client, // C'est maintenant dynamique !
    lieu: document.getElementById("lieu").value,
    date: document.getElementById("dateChant").value,
    heureDeb: document.getElementById("heureDebChant").value,
    heureFin: document.getElementById("heureFinChant").value,
    description: compilerDescription(),
    materiaux: compilerMateriaux(),
    volume: document.getElementById("volume").value,
    broyeur: convertirMinutesEnHeures("broyeur"),
    machines: convertirMinutesEnHeures("machines")
  };
  
  fetch(scriptURL, { method: "POST", body: JSON.stringify(param) })
    .then(res => res.json())
    .then(() => {
      document.getElementById("message").innerText = "Chantier enregistré avec succès !";
      document.getElementById("formChantier").reset();
      gererTypeClient(); // Réinitialise aussi les champs client
      reinitialiserZoneDescription();
    })
    .catch(() => document.getElementById("message").innerText = "Erreur lors de l'enregistrement.");
}

  /* FONCTION POUR GÉRER LES LIGNES D'ACHATS AUTRES */
function gererLignesAchatsAutres(event) {
  const el = event.target;

  // Si l'utilisateur tape du texte dans un input classique
  if (el && el.tagName === 'INPUT' && el.classList.contains('champ-description')) {
    // Si le texte commence à déborder de la largeur visible du champ
    if (el.scrollWidth > el.clientWidth) {
      const textarea = document.createElement('textarea');
      textarea.className = el.className;
      textarea.placeholder = el.placeholder;
      textarea.value = el.value;
      textarea.setAttribute('oninput', 'gererLignesAchatsAutres(event)');

      el.parentNode.replaceChild(textarea, el);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);

      // Force le comportement fluide immédiatement
      textarea.style.setProperty('height', 'auto', 'important');
      textarea.style.setProperty('height', textarea.scrollHeight + 'px', 'important');
    }
  }
  // Si c'est déjà un textarea, on gère son agrandissement classique
  else if (el && el.tagName === 'TEXTAREA') {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // LOGIQUE DE CRÉATION DE NOUVELLE LIGNE À L'INFINI
  const zone = document.getElementById('zoneAchatsAutres');
  const lignes = zone.getElementsByClassName('ligne-achat-autre');
  const derniereLigne = lignes[lignes.length - 1];

  const inputMontant = derniereLigne.querySelector('.champ-montant');
  const inputDescription = derniereLigne.querySelector('.champ-description');

  if (inputMontant.value.trim() !== "" || inputDescription.value.trim() !== "") {
    const nouvelleLigne = document.createElement('div');
    nouvelleLigne.className = 'ligne-achat-autre';
    nouvelleLigne.innerHTML = `
      <div class="bloc-montant">
        <input type="number" class="champ-montant" placeholder="CHF" step="0.01" oninput="gererLignesAchatsAutres(event)">
      </div>
      <div class="bloc-description">
        <input type="text" class="champ-description" placeholder="Description" oninput="gererLignesAchatsAutres(event)">
      </div>
    `;
    zone.appendChild(nouvelleLigne);
  }
}

function compilerFrais() {
  const lignes = document.getElementsByClassName('ligne-achat-autre');
  let descriptionTotale = "";

  for (let i = 0; i < lignes.length; i++) {
    const texte = lignes[i].querySelector('.champ-description').value.trim();
    const montant = lignes[i].querySelector('.champ-montant').value.trim();

    if (texte !== "" || montant !== "") {
      descriptionTotale += `${texte}\t : CHF${montant}\n`;
    }
  }
  return descriptionTotale.trim();
}
  
function compterFrais() {
  const lignes = document.getElementsByClassName('ligne-achat-autre');
  let amount = 0;

  for (let i = 0; i < lignes.length; i++) {
    const texte = lignes[i].querySelector('.champ-description').value.trim();
    const montant = lignes[i].querySelector('.champ-montant').value.trim();

    if (texte !== "" || montant !== "") {
      amount += parseFloat(montant);
    }
  }
  return amount;
}
