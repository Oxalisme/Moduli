<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Formulaires</title>

<!-- Images du raccourci écran d'accueil et favicon -->
<link rel="apple-touch-icon" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">
<link rel="icon" type="image/png" href="https://github.com/Oxalisme/Moduli/blob/main/9a4b02e0-b721-4d43-90f4-cd531697cf13.png">

<style>
  
/* CORRECTION LARGEUR : Force tous les éléments à respecter strictement les 100% */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
}
/*style de base pour TOUS les boutons*/
button {
  width: 100% !important;
  padding: 20px;
  margin: 10px 0;
  font-size: 30px;
  border-radius: 12px;
}
form {
  display: none;
  margin-top: 20px;
}
input, textarea, select {
  width: 100% !important;
  padding: 10px;
  margin: 10px 0;
  font-size: 24px;
  border-radius: 12px;
  resize: none; /* Désactive la poignée manuelle pour laisser le script gérer la hauteur */
  overflow-y: hidden; 
}
textarea {
  min-height: 100px;
}
  
label {
  font-weight: bold;
  
}
#message {
  margin-top: 20px;
  font-weight: bold;
  color: green;
}
  
/* 1. THÈME CHANTIER (Rouge / Rose) */
/* .theme-chantier, */
.theme-chantier input, 
.theme-chantier textarea, 
.theme-chantier select {
  background-color: #FEF2F2;
  border: 1px solid #9F0712;
}

/* 2. THÈME HEURES (Vert) */
/* .theme-heures, */
.theme-heures input, 
.theme-heures textarea, 
.theme-heures select {
  background-color: #ECFDF5;
  border: 1px solid #016630;
}

/* 3. THÈME COMPLÉMENTS (Bleu) */
/* .theme-complements, */
.theme-complements input, 
.theme-complements textarea, 
.theme-complements select {
  background-color: #EFF6FF;
  border: 1px solid #193CB8;
}

/* 4. BOUTONS D'ENVOI (Jaune) */
button.btn-envoyer {
  background-color: #FEFCE8 !important;
}
/* On force la bordure du bouton d'envoi à correspondre à son formulaire parent */
.theme-chantier button.btn-envoyer { border: 1px solid #9F0712; }
.theme-heures button.btn-envoyer { border: 1px solid #016630; }
.theme-complements button.btn-envoyer { border: 1px solid #193CB8; }

</style>
</head>
<body>

<h2>Choisir un formulaire</h2>

<button onclick="showForm('chantier')" style="background-color: #FEF2F2; border: 1px solid #9F0712;">Chantier</button>
<button onclick="showForm('heures')" style="background-color: #ECFDF5; border: 1px solid #016630;">Heures</button>
<button onclick="showForm('complements')" style="background-color: #EFF6FF; border: 1px solid #193CB8;">Compléments OBSOLÈTE</button>

<!-- FORMULAIRE CHANTIER -->
<form id="formChantier" class="theme-chantier">
  <h3>Chantier</h3>

  <label>Ton nom</label>
  
  <!--
  <input type="text" id="collegueChant" required>
  -->  
  
  <select id="collegueChant" name="nom">
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg" selected>Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael" selected>Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (précise cette info dans le champs ci-dessous)</option>
  </select>

  <label>Avec qui tu as travaillé sur le chantier</label>
  <input type="text" id="collegueAutreChant" required>

  <label>Nom du client</label>
  <input type="text" id="client" required>

  <label>Lieu</label>
  <input type="text" id="lieu" placeholder="adresse ou précision p.ex. concernant les 4 maisons de Chloé" required>

  <label>Date</label>
  <input type="date" id="dateChant" required>

  <label>Description</label>
  <textarea id="description" placeholder="détails des travaux, p.ex:&#10désherbage -hh:mm,&#10tonte -hh:mm,&#10taille du liquidambar -hh:mm" required></textarea>

  <label>Volume déchets (en litres)</label>
  <input type="number" id="volume" placeholder="sac noir = 200L, sac blanc = 400L, remorque = 1m³" required>

  <label>Temps utilisation broyeur (en heures)</label>
  <input type="time" id="broyeur" style="background-color: #FEF2F2; border: 1px solid #9F0712;" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <label>Temps utilisation machines (en heures)</label>
  <input type="time" id="machines" placeholder="mettre en quart d'heure: p.ex. 1.25 pour 1h15min" required>

  <button type="button" onclick="sendChantier()">Envoyer</button>
</form>
  
<!-- FORMULAIRE HEURES -->
<form id="formHeures">
  <h3>Heures</h3>

  <label>Ton nom</label>
  <!--
  <input type="text" id="collegueHeures" required>
  -->  
  
  <select id="collegueHeures" name="nom">
    <option value="alu">Alu</option>
    <option value="delphine">Delphine</option>
    <option value="ellio">Ellio</option>
    <option value="greg" selected>Greg</option>
    <option value="juan">Juan</option>
    <option value="laura">Laura</option>
    <option value="laure">Laure</option>
    <option value="mickael" selected>Mickaël</option>
    <option value="oxa">Oxa</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam E.</option>
    <option value="other">AUTRE (précise cette info dans le champs Détails)</option>
  </select>

  <label>Date</label>
  <input type="date" id="dateHeures" required>

  <label>Heure du début (matin)</label>
  <input type="time" id="debut1" required>

  <label>Heure de fin (matin)</label>
  <input type="time" id="fin1" required>

  <label>Heure de début (après-midi)</label>
  <input type="time" id="debut2" required>

  <label>Heure de fin (après-midi)</label>
  <input type="time" id="fin2" required>
  
  <label>Détails par rapport aux heures</label>
  <textarea id="detailsHeures" placeholder="temps de pause ou autres" required></textarea>

  <label>Infos complémentaires pour la journée</label>
  <textarea id="complementsHeures" placeholder="km trajet, tickets repas, indemnité picnic, achats divers" required></textarea>

  <button type="button" onclick="sendHeures()">Envoyer</button>
</form>

<!-- FORMULAIRE COMPLEMENTS -->
<form id="formComplements">
  <h3>Compléments</h3>

  <label>Ton nom</label>
  <!--
  <input type="text" id="collegueComp" required>
  -->  
  
  <select id="collegueComp" name="nom">
    <option value="alu">Alu Minium</option>
    <option value="delphine">Del Fun</option>
    <option value="ellio">EllioM</option>
    <option value="greg" selected>Grégolo</option>
    <option value="juan">Juantourloupe</option>
    <option value="laure">L'or</option>
    <option value="mickael" selected>Mickaëleagnus</option>
    <option value="oxa">Oxaperlipopette</option>
    <option value="sam_hannes">Sam Lebelge</option>
    <option value="sam_eve">Sam Well</option>
    <option value="other">AUTRE (précise cette info dans le champs Détails)</option>
  </select>  

  <label>Date</label>
  <input type="date" id="dateComp" required>

  <label>Détails</label>
  <textarea id="details" placeholder="OBSOLÈTE, IL FAUT NOTER DANS LES HEURES" required></textarea>

  <button type="button" onclick="sendComplements()">Envoyer</button>
</form>

<div id="message"></div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxf_gEV5HoJO3zRZkrWQz6fnvMKmOYFvTcqf4S-gD-XkBfucw7tHjwyuwtE3PHXqrIS/exec";

function showForm(type) {
  // Masquage propre de tous les blocs
  document.getElementById("formChantier").style.display = "none";
  document.getElementById("formHeures").style.display = "none";
  document.getElementById("formComplements").style.display = "none";
  
  // Structure if/else nettoyée de toute écriture parasite
  if (type === "chantier") {
    document.getElementById("formChantier").style.display = "block";
  } else if (type === "heures") {
    document.getElementById("formHeures").style.display = "block";
  } else if (type === "complements") {
    document.getElementById("formComplements").style.display = "block";
  }
}

  // SCRIPT D'AUTO-AGRANDISSEMENT DES TEXTAREA
document.querySelectorAll('textarea').forEach(textarea => {
  textarea.addEventListener('input', function() {
    this.style.height = 'auto'; // Réinitialise la hauteur
    this.style.height = this.scrollHeight + 'px'; // Applique la hauteur réelle du contenu inséré
  });
});

function sendChantier() {
  const data = {
    type: "chantier",
    nom: document.getElementById("collegueChant").value,
    avec: document.getElementById("collegueAutreChant").value,
    client: document.getElementById("client").value,
    lieu: document.getElementById("lieu").value,
    date: document.getElementById("dateChant").value,
    description: document.getElementById("description").value,
    volume: document.getElementById("volume").value,
    broyeur: document.getElementById("broyeur").value,
    machines: document.getElementById("machines").value
  };

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById("message").innerText = "Enregistré !";
    clearChantier();
  });
}
    
function sendHeures() {
  const data = {
    type: "heures",
    nom: document.getElementById("collegueHeures").value,
    date: document.getElementById("dateHeures").value,
    debut1: document.getElementById("debut1").value,
    fin1: document.getElementById("fin1").value,
    debut2: document.getElementById("debut2").value,
    fin2: document.getElementById("fin2").value,
    details: document.getElementById("detailsHeures").value,
    complements: document.getElementById("complementsHeures").value
  };

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById("message").innerText = "Enregistré !";
    clearHeures();
  });
}

function sendComplements() {
  const data = {
    type: "complements",
    nom: document.getElementById("collegueComp").value,
    date: document.getElementById("dateComp").value,
    details: document.getElementById("details").value
  };

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById("message").innerText = "Enregistré !";
    clearComplements();
  });
}

function clearChantier() {
  document.getElementById("collegueChant").value = "";
  document.getElementById("collegueAutreChant").value = "";
  document.getElementById("client").value = "";
  document.getElementById("lieu").value = "";
  document.getElementById("dateChant").value = "";
  document.getElementById("description").value = "";
  document.getElementById("volume").value = "";
  document.getElementById("broyeur").value = "";
  document.getElementById("machines").value = "";
}

function clearHeures() {
  document.getElementById("collegueHeures").value = "";
  document.getElementById("dateHeures").value = "";
  document.getElementById("debut1").value = "";
  document.getElementById("fin1").value = "";
  document.getElementById("debut2").value = "";
  document.getElementById("fin2").value = "";
  document.getElementById("detailsHeures").value = "";

document.getElementById("complementsHeures").value = "";
}

function clearComplements() {
  document.getElementById("collegueComp").value = "";
  document.getElementById("dateComp").value = "";
  document.getElementById("details").value = "";
}
</script>

</body>
</html>
